name: Deploy MinesMinis Recovery

on:
  push:
    branches: [main]
    paths:
      - "recovery/**"
      - ".github/workflows/recovery-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: minesminis-recovery-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload recovery site
        uses: actions/upload-pages-artifact@v3
        with:
          path: recovery
      - name: Deploy recovery site
        id: deployment
        uses: actions/deploy-pages@v4
